<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixelsort</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #121417;
        --surface: #1a1d22;
        --line: #2c3139;
        --line-strong: #4a525e;
        --text: #e4e7eb;
        --muted: #9aa3ae;
        --accent: #8fb8de;
        --error: #f08c8c;
        --error-bg: #2a1a1c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      /* ---------- Topp ---------- */
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .info {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
      }

      .btn {
        padding: 8px 16px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
        transition: border-color 150ms ease, background 150ms ease;
      }

      .btn:hover:not(:disabled) {
        border-color: var(--accent);
      }

      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--bg);
        font-weight: 600;
      }

      .btn-primary:hover:not(:disabled) {
        background: #a5c7e6;
      }

      /* Deaktiverte knapper: tydelig dempet, og ingen hover-effekt */
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      /* ---------- Hovedområdet ---------- */
      main {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 20px;
      }

      .error {
        margin: 0;
        padding: 12px 16px;
        border: 1px solid var(--error);
        border-radius: 8px;
        background: var(--error-bg);
        color: var(--error);
      }

      /* Slippsonen fyller resten av vinduet */
      .drop {
        flex: 1;
        min-height: 240px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px dashed var(--line);
        border-radius: 14px;
        background: var(--surface);
        cursor: pointer;
        overflow: hidden;
        transition: border-color 150ms ease, background 150ms ease;
      }

      .drop:hover {
        border-color: var(--line-strong);
      }

      .drop.dragging {
        border-color: var(--accent);
        background: #1d232b;
      }

      /* Når et bilde vises, blir rammen roligere */
      .drop.has-image {
        border-style: solid;
        border-color: var(--line);
        background: var(--bg);
        cursor: default;
      }

      .empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        color: var(--muted);
      }

      .empty svg {
        width: 48px;
        height: 48px;
        color: var(--line-strong);
      }

      .empty strong {
        display: block;
        color: var(--text);
        font-size: 1.1rem;
        font-weight: 500;
      }

      .empty p {
        margin: 0;
      }

      .hint {
        font-size: 0.85rem;
      }

      kbd {
        padding: 1px 6px;
        border: 1px solid var(--line-strong);
        border-radius: 4px;
        font-family: inherit;
        font-size: 0.8rem;
      }

      /* Canvas har full oppløsning, men skaleres ned med CSS */
      canvas {
        display: block;
        max-width: 100%;
        max-height: calc(100vh - 140px); /* plass til toppen og marger */
        width: auto;
        height: auto;
        object-fit: contain;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Pixelsort</h1>
      <p class="info" id="info" aria-live="polite"></p>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="sort" disabled>Sorter</button>
        <button type="button" class="btn" id="reset" disabled>Tilbakestill</button>
        <button type="button" class="btn" id="pick-top" hidden>Velg nytt bilde</button>
      </div>
    </header>

    <main>
      <p class="error" id="error" role="alert" hidden></p>

      <!-- Slippsonen: kan klikkes, eller aktiveres med Enter/mellomrom -->
      <div
        class="drop"
        id="drop"
        tabindex="0"
        role="button"
        aria-label="Velg et bilde, eller dra og slipp et bilde her"
      >
        <div class="empty" id="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="9" cy="9" r="2" />
            <path d="m21 15-5-5L5 21" />
          </svg>
          <p>
            <strong>Ingen bilde valgt ennå</strong>
            Dra og slipp et bilde hit, eller velg et fra maskinen din.
          </p>
          <span class="btn btn-primary" aria-hidden="true">Velg bilde</span>
          <p class="hint">
            Du kan også trykke <kbd>Enter</kbd> her, eller lime inn med <kbd>Ctrl</kbd>+<kbd>V</kbd>.
          </p>
        </div>
        <canvas id="canvas" hidden></canvas>
      </div>

      <input type="file" id="file" accept="image/*" class="sr-only" tabindex="-1" aria-hidden="true" />
    </main>

    <script>
      const drop = document.getElementById("drop");
      const empty = document.getElementById("empty");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const fileInput = document.getElementById("file");
      const errorBox = document.getElementById("error");
      const info = document.getElementById("info");
      const pickTop = document.getElementById("pick-top");
      const sortBtn = document.getElementById("sort");
      const resetBtn = document.getElementById("reset");

      // Originalbildet lagres her som en egen kopi av pikslene.
      // Den blir aldri endret – sorteringen jobber alltid på en ny kopi.
      let original = null;
      let fileName = "";

      function updateInfo(state) {
        info.textContent = `${fileName} · ${canvas.width} × ${canvas.height} px · ${state}`;
      }

      // ---------- Åpne filvelgeren ----------
      function openPicker() {
        fileInput.value = ""; // så samme fil kan velges på nytt
        fileInput.click();
      }

      drop.addEventListener("click", () => {
        if (!drop.classList.contains("has-image")) openPicker();
      });

      drop.addEventListener("keydown", (event) => {
        // Når et bilde vises, er slippsonen ikke lenger en knapp
        if (drop.classList.contains("has-image")) return;
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openPicker();
        }
      });

      pickTop.addEventListener("click", openPicker);

      fileInput.addEventListener("change", () => {
        if (fileInput.files.length > 0) loadFile(fileInput.files[0]);
      });

      // ---------- Dra og slipp ----------
      // Lytter på hele vinduet, så man kan slippe hvor som helst
      let dragDepth = 0;

      window.addEventListener("dragenter", (event) => {
        event.preventDefault();
        dragDepth++;
        drop.classList.add("dragging");
      });

      window.addEventListener("dragover", (event) => {
        event.preventDefault(); // nødvendig for at "drop" skal virke
      });

      window.addEventListener("dragleave", () => {
        dragDepth--;
        if (dragDepth <= 0) {
          dragDepth = 0;
          drop.classList.remove("dragging");
        }
      });

      window.addEventListener("drop", (event) => {
        event.preventDefault();
        dragDepth = 0;
        drop.classList.remove("dragging");
        const file = event.dataTransfer.files[0];
        if (file) loadFile(file);
        else showError("Det du slapp var ikke en fil. Prøv å dra et bilde fra maskinen din.");
      });

      // ---------- Lim inn (Ctrl+V) ----------
      window.addEventListener("paste", (event) => {
        const file = [...event.clipboardData.files][0];
        if (file) loadFile(file);
      });

      // ---------- Last inn og tegn bildet ----------
      function loadFile(file) {
        if (!file.type.startsWith("image/")) {
          showError(
            `«${file.name}» er ikke et bilde. Velg en bildefil, for eksempel PNG, JPG, GIF eller WebP.`
          );
          return;
        }

        const url = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
          // Full oppløsning: canvas får bildets egne mål i piksler
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);

          try {
            original = ctx.getImageData(0, 0, canvas.width, canvas.height);
          } catch (err) {
            original = null;
            sortBtn.disabled = true;
            resetBtn.disabled = true;
            showError(`Klarte ikke å lese pikslene i «${file.name}». Bildet kan være for stort.`);
            return;
          }
          fileName = file.name;

          hideError();
          empty.hidden = true;
          canvas.hidden = false;
          drop.classList.add("has-image");
          drop.setAttribute("tabindex", "-1");
          drop.removeAttribute("role");
          drop.setAttribute("aria-label", "Bilde: " + file.name);
          pickTop.hidden = false;
          sortBtn.disabled = false;
          resetBtn.disabled = false;
          updateInfo("Original");
          sortBtn.focus(); // neste naturlige steg
        };

        img.onerror = () => {
          URL.revokeObjectURL(url);
          showError(`Klarte ikke å åpne «${file.name}». Filen kan være skadet, eller formatet støttes ikke av nettleseren.`);
        };

        img.src = url;
      }

      // ---------- Sortering ----------
      // Lysstyrke 0–255, vektet slik øyet oppfatter farger (grønt virker lysest, blått mørkest)
      function sortRowsByBrightness(src) {
        const { width: w, height: h } = src;
        const out = new ImageData(w, h);
        const bytes = src.data;
        const srcPx = new Uint32Array(bytes.buffer); // én verdi per piksel (R, G, B og A samlet)
        const outPx = new Uint32Array(out.data.buffer);
        const brightness = new Uint8Array(w);
        const slots = new Uint32Array(256);

        for (let y = 0; y < h; y++) {
          const row = y * w;
          slots.fill(0);

          // 1) Mål lysstyrken på hver piksel i raden, og tell hvor mange det er av hver
          for (let x = 0; x < w; x++) {
            const i = (row + x) * 4;
            const b = ((bytes[i] * 299 + bytes[i + 1] * 587 + bytes[i + 2] * 114 + 500) / 1000) | 0;
            brightness[x] = b;
            slots[b]++;
          }

          // 2) Regn ut hvor hver lysstyrke-gruppe skal begynne i raden
          let pos = 0;
          for (let b = 0; b < 256; b++) {
            const count = slots[b];
            slots[b] = pos;
            pos += count;
          }

          // 3) Plasser pikslene, mørkeste først. Like lyse beholder rekkefølgen sin.
          for (let x = 0; x < w; x++) {
            outPx[row + slots[brightness[x]]++] = srcPx[row + x];
          }
        }
        return out;
      }

      sortBtn.addEventListener("click", () => {
        if (!original) return;
        ctx.putImageData(sortRowsByBrightness(original), 0, 0);
        updateInfo("Sortert");
      });

      resetBtn.addEventListener("click", () => {
        if (!original) return;
        ctx.putImageData(original, 0, 0);
        updateInfo("Original");
      });

      // ---------- Feilmeldinger ----------
      function showError(message) {
        errorBox.textContent = message;
        errorBox.hidden = false;
      }

      function hideError() {
        errorBox.hidden = true;
        errorBox.textContent = "";
      }
    </script>
  </body>
</html>
