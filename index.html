<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixelsort</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Pixelsort</h1>
      <p class="info" id="info" aria-live="polite"></p>
    </header>

    <div class="layout">
      <!-- Kontrollpanelet: til venstre på PC, nederst på mobil -->
      <aside class="panel" aria-label="Kontrollpanel">
        <section class="panel-section panel-image" aria-label="Bilde">
          <button type="button" class="btn" id="pick-top">Velg bilde</button>
        </section>

        <!-- Valg for sorteringen: radioknapper som ser ut som segmenterte knapper.
             Tab går til gruppen, piltastene bytter valg. -->
        <section class="panel-section panel-options" aria-labelledby="options-title">
          <h2 class="panel-title" id="options-title">Sortering</h2>
          <div class="options">
            <fieldset class="choice choice-direction">
              <legend>Retning</legend>
              <div class="segmented">
                <label><input type="radio" name="direction" value="rows" checked /><span>Rader</span></label>
                <label><input type="radio" name="direction" value="columns" /><span>Kolonner</span></label>
              </div>
            </fieldset>
            <fieldset class="choice choice-key">
              <legend>Sorter etter</legend>
              <div class="segmented">
                <label><input type="radio" name="key" value="brightness" checked /><span>Lysstyrke</span></label>
                <label><input type="radio" name="key" value="hue" /><span>Nyanse</span></label>
                <label><input type="radio" name="key" value="saturation" /><span>Metning</span></label>
              </div>
            </fieldset>
            <fieldset class="choice choice-order">
              <legend>Rekkefølge</legend>
              <div class="segmented">
                <label><input type="radio" name="order" value="asc" checked /><span>Stigende</span></label>
                <label><input type="radio" name="order" value="desc" /><span>Synkende</span></label>
              </div>
            </fieldset>
          </div>
        </section>

        <!-- Terskler: bare piksler med lysstyrke mellom grensene blir sortert,
             uansett hva det sorteres etter -->
        <section class="panel-section panel-thresholds" aria-labelledby="controls-title" aria-describedby="controls-hint">
          <h2 class="panel-title" id="controls-title">Utvalg etter lysstyrke</h2>
          <p class="panel-hint" id="controls-hint">Bare piksler med lysstyrke mellom grensene blir sortert.</p>
          <div class="controls">
            <div class="field">
              <div class="field-head">
                <label for="lower">Nedre grense</label>
                <output id="lower-value" for="lower">0</output>
              </div>
              <input type="range" id="lower" min="0" max="255" step="1" value="0" />
            </div>
            <div class="field">
              <div class="field-head">
                <label for="upper">Øvre grense</label>
                <output id="upper-value" for="upper">255</output>
              </div>
              <input type="range" id="upper" min="0" max="255" step="1" value="255" />
            </div>
          </div>
        </section>

        <section class="panel-section panel-actions" aria-label="Handlinger">
          <button type="button" class="btn btn-primary" id="sort" disabled>Sorter</button>
          <button type="button" class="btn" id="reset" disabled>Tilbakestill</button>
        </section>
      </aside>

      <main>
        <p class="error" id="error" role="alert" hidden></p>

        <!-- Slippsonen: kan klikkes, eller aktiveres med Enter/mellomrom -->
        <div
          class="drop"
          id="drop"
          tabindex="0"
          role="button"
          aria-label="Velg et bilde, eller dra og slipp et bilde her"
        >
          <div class="empty" id="empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <circle cx="9" cy="9" r="2" />
              <path d="m21 15-5-5L5 21" />
            </svg>
            <p>
              <strong>Ingen bilde valgt ennå</strong>
              Dra og slipp et bilde hit, eller velg et fra maskinen din.
            </p>
            <span class="btn btn-primary" aria-hidden="true">Velg bilde</span>
            <p class="hint">
              Du kan også trykke <kbd>Enter</kbd> her, eller lime inn med <kbd>Ctrl</kbd>+<kbd>V</kbd>.
            </p>
          </div>
          <canvas id="canvas" hidden></canvas>
        </div>

        <input type="file" id="file" accept="image/*" class="sr-only" tabindex="-1" aria-hidden="true" />
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
